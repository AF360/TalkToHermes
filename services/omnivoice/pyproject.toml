[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[project]
name = "talktohermes-omnivoice"
version = "1.0.0"
description = "Hardened OpenAI-compatible OmniVoice service for TalkToHermes"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi==0.133.1",
  "omnivoice==0.2.1",
  "pydantic==2.13.4",
  "pyyaml==6.0.3",
  "uvicorn==0.41.0",
]

[project.scripts]
talktohermes-omnivoice = "talktohermes_omnivoice.cli:main"

[dependency-groups]
dev = [
  "httpx==0.28.1",
  "pytest==9.1.1",
  "pytest-asyncio==1.3.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/talktohermes_omnivoice"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
