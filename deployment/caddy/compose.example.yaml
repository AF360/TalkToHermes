# Example Caddy service for a host-local TalkToHermes bridge.
# Copy this fragment into an operator-managed Compose project and provide a
# reviewed merged Caddyfile as ./Caddyfile. Host networking is required so
# 127.0.0.1 refers to the host loopback where the bridge listens.
services:
  caddy:
    image: caddy:2.11.4@sha256:df7f1c2fb114453b951de51a98efc010db1655a92c2e86be6706714e2417a78d
    network_mode: host
    restart: unless-stopped
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
